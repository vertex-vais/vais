<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Use and compare the best AI models for free – chat, images, web search and Agent X, all in one place.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ApeX">
  <meta property="og:title" content="ApeX – The best AI models, free">
  <meta property="og:description" content="Use and compare the best AI models for free – chat, images, web search and Agent X, all in one place.">
  <meta property="og:url" content="__ORIGIN__/">
  <meta property="og:image" content="__ORIGIN__/og.jpg?v=4">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ApeX – the best AI models, free, in one place">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ApeX – The best AI models, free">
  <meta name="twitter:description" content="Use and compare the best AI models for free – chat, images, web search and Agent X, all in one place.">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in – ApeX</title>
  <meta name="title-en" content="Sign in – ApeX">
  <meta name="title-de" content="Anmelden – ApeX">
  <script src="/boot.js"></script>
  <link rel="icon" href="/favicon-32-v3.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v3.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="ApeX">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth">
    <header class="auth-top">
      <a class="brand" href="/login" aria-label="ApeX">
        <img class="brand-mark" src="/icons/apex-mark.png" alt="" width="28" height="28">
        <span>ApeX</span>
      </a>
      <select class="lang-select" id="lang-select" aria-label="Sprache / Language"></select>
    </header>

    <main class="auth-main">
      <div class="auth-box">
        <h1 class="auth-title" id="title">Willkommen bei ApeX</h1>
        <p class="auth-sub" id="sub">Die besten KI-Modelle an einem Ort. Kostenlos.</p>

        <!-- 1 · E-Mail -->
        <section class="step active" data-step="email">
          <form id="form-email" novalidate>
            <label class="sr-only" for="email" data-en="Email address">E-Mail-Adresse</label>
            <input class="input" id="email" type="email" name="email" placeholder="E-Mail-Adresse" data-en-placeholder="Email address"
                   autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required autofocus>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Continue">Weiter</button>
          </form>
          <div class="google-box" id="google-box" hidden>
            <p class="or"><span data-en="or">oder</span></p>
            <a class="btn google-btn" href="/api/auth/google">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
              <span data-en="Continue with Google">Mit Google anmelden</span>
            </a>
          </div>
        </section>

        <!-- 2a · Anmelden -->
        <section class="step" data-step="login">
          <form id="form-login" novalidate>
            <div class="chip"><span data-email></span><button class="link" type="button" data-back data-en="Change">Ändern</button></div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="login-password" data-en="Password">Passwort</label>
              <input class="input" id="login-password" type="password" placeholder="Passwort" data-en-placeholder="Password" autocomplete="current-password" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Sign in">Anmelden</button>
            <div class="row center"><button class="link" type="button" id="forgot" data-en="Forgot password?">Passwort vergessen?</button></div>
          </form>
        </section>

        <!-- 2b · Registrieren -->
        <section class="step" data-step="register">
          <form id="form-register" novalidate>
            <div class="chip"><span data-email></span><button class="link" type="button" data-back data-en="Change">Ändern</button></div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="register-password" data-en="Choose a password">Passwort wählen</label>
              <input class="input" id="register-password" type="password" placeholder="Passwort wählen" data-en-placeholder="Choose a password"
                     autocomplete="new-password" minlength="8" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="hint" data-en="At least 8 characters.">Mindestens 8 Zeichen.</p>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Create account">Konto erstellen</button>
          </form>
        </section>

        <!-- 3 · Code bestätigen -->
        <section class="step" data-step="verify">
          <form id="form-verify" novalidate>
            <div class="otp" data-otp>
              <label class="sr-only" for="verify-code" data-en="6-digit code">6-stelliger Code</label>
              <input id="verify-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
              <div class="otp-boxes" aria-hidden="true"></div>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Confirm">Bestätigen</button>
            <div class="row">
              <button class="link" type="button" data-back data-en="Different email">Andere E-Mail</button>
              <button class="link" type="button" data-resend="verify">Code erneut senden</button>
            </div>
          </form>
        </section>

        <!-- 4 · Passwort zurücksetzen -->
        <section class="step" data-step="reset">
          <form id="form-reset" novalidate>
            <div class="otp" data-otp>
              <label class="sr-only" for="reset-code" data-en="6-digit code">6-stelliger Code</label>
              <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
              <div class="otp-boxes" aria-hidden="true"></div>
            </div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="reset-password" data-en="New password">Neues Passwort</label>
              <input class="input" id="reset-password" type="password" placeholder="Neues Passwort" data-en-placeholder="New password"
                     autocomplete="new-password" minlength="8" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Save password">Passwort speichern</button>
            <div class="row">
              <button class="link" type="button" data-back data-en="Back">Zurück</button>
              <button class="link" type="button" data-resend="reset">Code erneut senden</button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="auth-foot">© <span id="year"></span> ApeX · <a href="/datenschutz" data-en="Privacy">Datenschutz</a> · <a href="/impressum" data-en="Legal notice">Impressum</a></footer>
  </div>

  <script src="/login.js" type="module"></script>
</body>
</html>
